name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format
        working-directory: contracts
        run: forge fmt --check
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test (unit, fuzz, invariant)
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vv

  service:
    name: Service (lint + tests against anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build contracts
        working-directory: contracts
        run: forge build
      - name: ABIs match the contracts
        run: |
          python3 scripts/export_abi.py
          git diff --exit-code service/src/dataledger/abi
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: service
        run: uv sync --locked
      - name: Lint
        working-directory: service
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        working-directory: service
        run: uv run pytest -q
