[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

[lint]
# `registry()` keeps a camelCase getter for a readable ABI; keccak256 is kept in Solidity for clarity over gas.
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256"]
