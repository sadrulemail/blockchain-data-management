# Alembic command-line configuration, for authoring revisions:
#   cd service && uv run alembic -c src/dataledger/migrations/alembic.ini revision --autogenerate -m "describe it"
# The service itself migrates with `dataledger db upgrade` (or on start when DATALEDGER_AUTO_MIGRATE is true).
# The database URL comes from DATALEDGER_DATABASE_URL.

[alembic]
script_location = dataledger:migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
