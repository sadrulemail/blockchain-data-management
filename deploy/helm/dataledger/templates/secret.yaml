{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dataledger.secretName" . }}
  labels:
    {{- include "dataledger.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseUrl }}: {{ required "secrets.databaseUrl or secrets.existingSecret is required" .Values.secrets.databaseUrl | quote }}
  {{ .Values.secrets.keys.masterKeys }}: {{ required "secrets.masterKeys or secrets.existingSecret is required" .Values.secrets.masterKeys | quote }}
  {{- with .Values.secrets.gatewayPrivateKey }}
  {{ $.Values.secrets.keys.gatewayPrivateKey }}: {{ . | quote }}
  {{- end }}
{{- end }}
