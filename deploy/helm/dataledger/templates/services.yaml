apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataledger.fullname" . }}-api
  labels:
    {{- include "dataledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dataledger.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.indexer.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataledger.fullname" . }}-indexer
  labels:
    {{- include "dataledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  type: ClusterIP
  selector:
    {{- include "dataledger.selector" (dict "root" . "component" "indexer") | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.indexer.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- end }}
