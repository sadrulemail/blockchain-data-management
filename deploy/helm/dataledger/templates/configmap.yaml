apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dataledger.fullname" . }}-deployment
  labels:
    {{- include "dataledger.labels" . | nindent 4 }}
data:
  deployment.json: |
    {{- $d := .Values.chain.deployment }}
    {{- dict "chainId" $d.chainId "startBlock" $d.startBlock "dataRegistry" (required "chain.deployment.dataRegistry is required" $d.dataRegistry) "accessLedger" (required "chain.deployment.accessLedger is required" $d.accessLedger) "qualityLedger" (required "chain.deployment.qualityLedger is required" $d.qualityLedger) | toPrettyJson | nindent 4 }}
